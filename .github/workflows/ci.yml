# CI for your Skill Atlas repository: the typecheck, the tests and the CLI itself, on every push
# and pull request, on a clean machine. A pull request is ready when this is green.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Chromium, before the tests: tests/demo.test.ts records videos with it, the e2e tests use it too.
      - run: npx playwright install --with-deps chromium
      # With a token, the tests also scan intellij-community on live GitHub. A personal one:
      # code search often answers 429 to the Actions token. Without the secret, that test is skipped.
      - run: npm test
        env:
          GITHUB_TOKEN: ${{ secrets.ATLAS_GITHUB_TOKEN }}
      # The web view in a browser: the base scenarios of spec/web.md.
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
      # The demos (demo/README.md): a video of each, for the pull request, in the run's artifacts.
      - run: npm run demo
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-videos
          path: demo-videos/
      # The real CLI on the fixture repository, as a user would run it: it must exit 0.
      - name: Smoke test
        run: |
          ./skill-atlas help
          ./skill-atlas scan ./fixture
      # The web view, as a user would open it: the page, and a scan behind it.
      - name: Smoke test, web
        run: |
          ./skill-atlas serve &
          for i in $(seq 20); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 0.5; done
          curl -sf http://localhost:3000/ | grep -q 'Skill Atlas'
          curl -sf 'http://localhost:3000/api/scan?repo=./fixture' | grep -q '"name":"commits"'
